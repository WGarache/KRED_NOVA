{% extends "base.html" %}{% load static %}{% block title %}Ingresar{% endblock %}{% block content %}
<div style="max-width:400px;margin:4vh auto 0">
  <div style="text-align:center;margin-bottom:24px"><img src="{% static 'kred/logo.png' %}" alt="{{ empresa }} — {{ lema }}" style="width:260px;max-width:80%;height:auto"></div>
  <form method="post" class="card f" style="padding:24px">{% csrf_token %}
    <h1 style="font-size:22px;margin-bottom:16px">Bienvenido</h1>
    {% if form.errors %}<div class="msg error">Usuario o contraseña incorrectos.</div>{% endif %}
    <p><label for="id_username">Usuario</label><input class="inp" id="id_username" name="username" autocomplete="username" autocapitalize="none" required autofocus></p>
    <p><label for="id_password">Contraseña</label><input class="inp" id="id_password" type="password" name="password" autocomplete="current-password" required></p>
    <button class="btn" style="width:100%;min-height:52px;font-size:17px;margin-top:6px">Entrar</button>
    <div style="height:4px;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-lt));margin-top:22px"></div>
    <p class="muted" style="text-align:center;font-size:13px;margin:10px 0 0">{{ empresa }} · Sistema de cartera y cobros</p>
  </form>
</div>
{% endblock %}
